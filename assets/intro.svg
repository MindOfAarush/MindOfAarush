<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title"><title id="title">Aarush Bhasin. I build things you can explore, play with, and break apart.</title><style>@media(prefers-reduced-motion:reduce){svg *{animation:none!important}} text{font-family:Arial,Helvetica,sans-serif}.word{opacity:0;animation:words 9s cubic-bezier(.77,0,.175,1) infinite}.one{animation-delay:0s;opacity:1}.two{animation-delay:3s}.three{animation-delay:6s}@keyframes words{0%,28%{opacity:1;transform:translateY(0)}32%,98%{opacity:0;transform:translateY(-8px)}100%{opacity:1;transform:translateY(0)}}.pixel{animation:lift 4s cubic-bezier(.77,0,.175,1) infinite}.p1{animation-delay:-1s}.p2{animation-delay:-2s}.p3{animation-delay:-3s}@keyframes lift{0%,100%{transform:translateY(0);opacity:.65}50%{transform:translateY(-12px);opacity:1}}</style><rect width="960" height="300" rx="18" fill="#0b0e12"/>
