<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title"><title id="title">Play with this website: animated robot fires, breaks panels and rewinds them</title><style>@media(prefers-reduced-motion:reduce){svg *{animation:none!important}} text{font-family:Arial,Helvetica,sans-serif}.robot{animation:idle 3s ease-in-out infinite}@keyframes idle{50%{transform:translateY(-5px)}}.weapon{animation:recoil 3s cubic-bezier(.23,1,.32,1) infinite}@keyframes recoil{0%,46%,56%,100%{transform:translateX(0)}49%{transform:translateX(-10px)}}.flash{opacity:0;animation:fire 3s linear infinite}@keyframes fire{0%,46%,52%,100%{opacity:0}47%,50%{opacity:1}}.shot{opacity:0;animation:shoot 3s linear infinite}@keyframes shoot{0%,46%{opacity:0;transform:translateX(0)}47%{opacity:1;transform:translateX(0)}59%{opacity:0;transform:translateX(330px)}100%{opacity:0;transform:translateX(330px)}}.piece{transform-box:fill-box;transform-origin:center;animation:break 3s cubic-bezier(.77,0,.175,1) infinite}.q1{animation-delay:-.25s}.q2{animation-delay:-.5s}@keyframes break{0%,53%,100%{transform:translate(0,0) rotate(0);opacity:1}66%,78%{transform:translate(35px,18px) rotate(13deg);opacity:.25}}.eyes{animation:blink 6s linear infinite}@keyframes blink{0%,95%,100%{opacity:1}97%{opacity:.1}}</style><rect width="960" height="540" rx="18" fill="#0d141a"/>
