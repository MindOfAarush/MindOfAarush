name: Refresh public activity artwork

on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/activity.py
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: profile-artwork
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Render and publish real public events
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/activity.py --publish
